# The Docker image, for x64 and arm64, published to GitHub's container
# registry as ghcr.io/bretteroo/sonora.
#
#   tag v1.2.3       -> :1.2.3, :1.2 and :latest
#   pull request     -> built for both platforms, not published
#
# Only a release publishes; a push to main builds nothing. :latest is what
# docker-compose.yml pulls.
#
# The frontend stage runs on the runner's own platform (the Dockerfile pins it
# to $BUILDPLATFORM), so only the Python stage is emulated for arm64.
name: Docker image

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/bretteroo/sonora
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Sonora
            org.opencontainers.image.description=Web controller for Sonos S1 and S2 systems
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Home Assistant app's Supervisor reads the version from the image.
          build-args: |
            SONORA_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
