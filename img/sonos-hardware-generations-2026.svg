<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">Sonos hardware generations timeline</title>
  <desc id="chartDesc">Timeline chart showing S1 only from 2005 to 2015, S2.0 from 2011 to 2022, and S2.1 from 2017 to today, with milestone markers at 2020 and 2025, extended through 2026 on the axis.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .font {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        fill: #344054;
      }
      .body  { font-size: 20px; }
      .axis  { font-size: 18px; fill: #475467; }
      .label { font-size: 22px; font-weight: 700; }
      .bar   { font-size: 22px; font-weight: 700; }
      .anno  { font-size: 18px; fill: #667085; }
    </style>
  </defs>

  <!-- Card -->
  <rect x="16" y="16" width="1568" height="528" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Timeline scale:
       2005 = 230
       2010 = 530
       2015 = 830
       2020 = 1130
       2025 = 1430
       2026 = 1490
       width = 1260 (60 px/year)
  -->

  <!-- Guide lines extended to top -->
  <line x1="1130" y1="28" x2="1130" y2="405"
        stroke="#98A2B3"
        stroke-width="1.5"
        stroke-dasharray="6 6"/>

  <line x1="1430" y1="28" x2="1430" y2="405"
        stroke="#98A2B3"
        stroke-width="1.5"
        stroke-dasharray="6 6"/>

  <!-- Top-aligned annotations, separated -->
  <text x="1116" y="48"
        text-anchor="end"
        class="font anno">
    S2 app, June 2020
  </text>

  <text x="1416" y="48"
        text-anchor="end"
        class="font anno">
    S2.0 frozen, 2025
  </text>

  <!-- Background tracks -->
  <rect x="230" y="138" width="1260" height="48" rx="12" fill="#EEF2F6"/>
  <rect x="230" y="258" width="1260" height="48" rx="12" fill="#EEF2F6"/>
  <rect x="230" y="378" width="1260" height="48" rx="12" fill="#EEF2F6"/>

  <!-- Left pills -->
  <rect x="52" y="160" width="112" height="44" rx="22" fill="#FFF5F5" stroke="#FF3B30" stroke-width="2"/>
  <text x="108" y="188" text-anchor="middle" class="font label" fill="#FF3B30">S1</text>

  <rect x="52" y="280" width="112" height="44" rx="22" fill="#FFF9EB" stroke="#D99000" stroke-width="2"/>
  <text x="108" y="308" text-anchor="middle" class="font label" fill="#D99000">S2</text>

  <rect x="52" y="400" width="112" height="44" rx="22" fill="#EDFDF3" stroke="#16A34A" stroke-width="2"/>
  <text x="108" y="428" text-anchor="middle" class="font label" fill="#16A34A">S2.1</text>

  <!-- Timeline bars aligned to the year scale -->
  <!-- S1 only: 2005 to 2015 -->
  <rect x="230" y="138" width="600" height="48" rx="12" fill="#FFF1F1" stroke="#FF3B30" stroke-width="2"/>
  <text x="252" y="170" class="font bar" fill="#FF3B30">2005 to 2015</text>

  <!-- S2.0: 2011 to 2022 -->
  <rect x="590" y="258" width="660" height="48" rx="12" fill="#FFF7DB" stroke="#D99000" stroke-width="2"/>
  <text x="612" y="290" class="font bar" fill="#D99000">2011 to 2022</text>

  <!-- S2.1: 2017 to today -->
  <rect x="950" y="378" width="540" height="48" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="972" y="410" class="font bar" fill="#16A34A">2017 to today</text>

  <!-- Body text -->
  <text x="230" y="218" class="font body">
    ZonePlayer 100 (January 2005) to Play:5 gen 1 (November 2015). Nothing from these years can run S2.
  </text>

  <text x="230" y="338" class="font body">
    Play:3 (July 2011) to Symfonisk table lamp gen 1 (January 2022). Runs S2, frozen out of new features in 2025.
  </text>

  <text x="230" y="458" class="font body">
    Sonos One (October 2017) onward. Everything Sonos sells today.
  </text>

  <!-- Axis line -->
  <line x1="230" y1="480" x2="1490" y2="480" stroke="#D0D5DD" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="230"  y="508" text-anchor="start" class="font axis">2005</text>
  <text x="530"  y="508" text-anchor="middle" class="font axis">2010</text>
  <text x="830"  y="508" text-anchor="middle" class="font axis">2015</text>
  <text x="1130" y="508" text-anchor="middle" class="font axis">2020</text>
  <text x="1430" y="508" text-anchor="middle" class="font axis">2025</text>
  <text x="1490" y="508" text-anchor="middle" class="font axis">2026</text>
</svg>
