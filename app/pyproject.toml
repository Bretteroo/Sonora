[project]
name = "sonora"
version = "1.0.0"
description = "Sonora: a local-network web controller for Sonos speakers, including S1 systems"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "pillow>=12.3.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "aiohttp>=3.12",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# jsonschema is for the tests only: Sonora generates the schema it
# publishes and never validates against it, but the tests check that
# what it publishes is a schema and that it catches what the gate does.
dev = ["pytest>=9.1.1", "pytest-asyncio>=0.24", "jsonschema>=4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
