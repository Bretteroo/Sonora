# The Home Assistant app. It runs the same image as docker-compose.yml, so
# `version` must name a published tag of ghcr.io/bretteroo/sonora and moves
# with every release.
name: Sonora
version: "1.1.0"
slug: sonora
description: Control your Sonos S1 and S2 speakers from any browser.
url: https://github.com/Bretteroo/Sonora
arch:
  - amd64
  - aarch64
image: ghcr.io/bretteroo/sonora
startup: application
boot: auto
# Sonora finds the speakers by multicast and they report every change by
# calling it back, so it has to be on the home network itself.
host_network: true
# The page in Home Assistant's sidebar, for every user, not only admins. Its
# port is the Supervisor's choice (0), so moving the web port below cannot
# break it; Sonora asks the Supervisor for it (backend/haoptions.py), which is
# what hassio_api is for.
ingress: true
ingress_port: 0
hassio_api: true
panel_icon: mdi:speaker-multiple
panel_title: Sonora
panel_admin: false
environment:
  # Lets Sonora trust the headers Home Assistant's proxy sends (backend/ingress.py).
  SONORA_HA_INGRESS: "1"
# What Sonora can fetch again; a backup needn't carry it.
backup_exclude:
  - logocache
  - products
# The ports Sonora listens on, on the Configuration tab. The app uses the
# host's network, so both have to be free on the Home Assistant machine.
options:
  web_port: 50205
  event_port: 50206
schema:
  web_port: port
  event_port: port
