[project]
name = "sonora"
version = "1.3.0"
description = "Sonora: a local-network web controller for Sonos speakers, including S1 systems"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "pillow>=13.0.0",
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "aiohttp>=3.14.5",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# jsonschema is for the tests only: Sonora generates the schema it
# publishes and never validates against it, but the tests check that
# what it publishes is a schema and that it catches what the gate does.
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "jsonschema>=4.26.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
